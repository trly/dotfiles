[".local/bin/todo"]
type = "archive-file"
url = "https://github.com/todotxt/todo.txt-cli/releases/download/v2.13.0/todo.txt_cli-2.13.0.tar.gz"
path = "todo.txt_cli-2.13.0/todo.sh"
[".zsh/plugins/fast-syntax-highlighting"]
type = "git-repo"
url = "https://github.com/zdharma-zmirror/fast-syntax-highlighting.git"
clone.args = ["--depth", "1", "--single-branch", "-b", "master"]
[".zsh/plugins/zsh-autosuggestions"]
type = "git-repo"
url = "https://github.com/zsh-users/zsh-autosuggestions.git"
clone.args = ["--depth", "1", "--single-branch", "--branch", "v0.7.1"]
[".zsh/plugins/zsh-completions"]
type = "git-repo"
url = "https://github.com/zsh-users/zsh-completions.git"
clone.args = ["--depth", "1", "--single-branch", "--branch", "0.35.0"]
